name: Production quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension compile lint and regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Compile TypeScript
        run: bun run compile
      - name: Enforce extension lint rules
        run: bun run lint
      - name: Run offline extension regression suite
        run: bun run test
      - name: Validate VS Code extension manifest assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!manifest.name || !manifest.publisher || !manifest.version || !manifest.engines?.vscode) {
            throw new Error('Required extension metadata is missing');
          }
          const files = [
            manifest.main,
            ...((manifest.contributes?.grammars || []).map(item => item.path)),
            ...((manifest.contributes?.languages || []).map(item => item.configuration).filter(Boolean)),
            ...((manifest.contributes?.snippets || []).map(item => item.path)),
          ];
          for (const file of files) {
            if (typeof file !== 'string' || !fs.existsSync(path.resolve(file))) {
              throw new Error(`Extension manifest references missing file: ${file}`);
            }
          }
          console.log(`Validated ${files.length} extension manifest assets`);
          NODE

  python-contracts:
    name: Python API contracts, ASGI integration and live Uvicorn smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned FastAPI gateway and HTTP/ASGI test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r gateway/requirements-pinned.txt
          python -m pip check
      - name: Check factual README contracts against tracked source
        run: python scripts/check_readme_contract.py
      - name: Require root file review on every source change
        run: python scripts/check_root_review.py
      - name: Run Python contracts, authenticated ASGI and live TCP gateway smoke
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  gateway-nbos-compatibility:
    name: Real NBOS client versus live gateway protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pinned FastAPI server dependencies
        run: |
          python -m pip install --disable-pip-version-check -r gateway/requirements-pinned.txt
          python -m pip check
      - name: Install locked extension client dependencies
        run: bun install --frozen-lockfile
      - name: Verify real Axios against negative gateway and positive read-only reference
        run: node --test tests/nbosGateway.real.integration.cjs tests/nbosReference.real.integration.cjs

  compose-security:
    name: Compose security regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Compose security regression and configuration checks
        run: |
          python3 -m unittest discover -s tests -p 'test_compose_security.py' -v
          python3 scripts/check_compose_security.py
