name: Compose security baseline

on:
  push:
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/check_compose_security.py"
      - ".github/workflows/compose-security-ci.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/check_compose_security.py"
      - ".github/workflows/compose-security-ci.yml"

permissions:
  contents: read

jobs:
  verify-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check root Compose interpolation and security invariants
        run: python3 scripts/check_compose_security.py
